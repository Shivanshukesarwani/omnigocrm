apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omnigocrm-db
  namespace: omnigocrm
spec:
  serviceName: omnigocrm-db
  replicas: 1
  selector:
    matchLabels: {app: omnigocrm-db}
  template:
    metadata:
      labels: {app: omnigocrm-db}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: omnigocrm-config, key: ESPOCRM_DATABASE_NAME}}}
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: omnigocrm-config, key: ESPOCRM_DATABASE_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: omnigocrm-secrets, key: db-password}}}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth=scram-sha-256"}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: db, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "omnigocrm", "-d", "omnigocrm"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "omnigocrm", "-d", "omnigocrm"]}
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: omnigocrm-db}
---
apiVersion: v1
kind: Service
metadata:
  name: omnigocrm-db
  namespace: omnigocrm
spec:
  clusterIP: None
  selector: {app: omnigocrm-db}
  ports: [{port: 5432, targetPort: 5432}]
