apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnigocrm
  namespace: omnigocrm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["crm.example.com"]
      secretName: omnigocrm-tls
  rules:
    - host: crm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: omnigocrm, port: {number: 80}}
