apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigocrm
  namespace: omnigocrm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: omnigocrm}
  template:
    metadata:
      labels: {app: omnigocrm}
    spec:
      containers:
        - name: omnigocrm
          image: ghcr.io/shivanshukesarwani/omnigocrm:10.0.8
          imagePullPolicy: IfNotPresent
          env:
            - {name: ESPOCRM_DATABASE_PLATFORM, value: Mysql}
            - {name: ESPOCRM_DATABASE_HOST, value: omnigocrm-db}
            - {name: ESPOCRM_DATABASE_PORT, value: "3306"}
            - {name: ESPOCRM_DATABASE_NAME, valueFrom: {configMapKeyRef: {name: omnigocrm-config, key: ESPOCRM_DATABASE_NAME}}}
            - {name: ESPOCRM_DATABASE_USER, valueFrom: {configMapKeyRef: {name: omnigocrm-config, key: ESPOCRM_DATABASE_USER}}}
            - {name: ESPOCRM_DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: omnigocrm-secrets, key: db-password}}}
            - {name: ESPOCRM_ADMIN_USERNAME, value: admin}
            - {name: ESPOCRM_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: omnigocrm-secrets, key: admin-password}}}
            - {name: ESPOCRM_SITE_URL, valueFrom: {configMapKeyRef: {name: omnigocrm-config, key: ESPOCRM_SITE_URL}}}
            - {name: ESPOCRM_CONFIG_ADMIN_UPGRADE, value: "false"}
            - {name: ESPOCRM_CONFIG_ADMIN_EXTENSION_UPLOAD, value: "false"}
          ports: [{containerPort: 80}]
          volumeMounts: [{name: data, mountPath: /var/www/html/data}]
          readinessProbe:
            exec: {command: ["bin/command", "app-check"]}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 20
          livenessProbe:
            exec: {command: ["bin/command", "app-check"]}
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: omnigocrm-data}
---
apiVersion: v1
kind: Service
metadata:
  name: omnigocrm
  namespace: omnigocrm
spec:
  selector: {app: omnigocrm}
  ports: [{port: 80, targetPort: 80}]
