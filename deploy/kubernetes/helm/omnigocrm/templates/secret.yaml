{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "omnigocrm.fullname" .) -}}
{{- $dbPassword := default (randAlphaNum 32) .Values.postgres.password -}}
{{- $jwtSecret := default (randAlphaNum 64) .Values.jwtSecret -}}
{{- if $existing }}
{{- $dbPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigocrm.fullname" . }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
{{- end }}
