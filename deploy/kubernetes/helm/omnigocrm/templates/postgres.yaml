apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "omnigocrm.fullname" . }}-postgres
spec:
  serviceName: {{ include "omnigocrm.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "omnigocrm.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "omnigocrm.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigocrm.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app: {{ include "omnigocrm.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
