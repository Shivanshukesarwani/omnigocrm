apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigocrm.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: {app: {{ include "omnigocrm.fullname" . }}-api}
  template:
    metadata: {labels: {app: {{ include "omnigocrm.fullname" . }}-api}}
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports: [{containerPort: 3000}]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "omnigocrm.fullname" . }}-postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://{{ include "omnigocrm.fullname" . }}-redis:6379
            - name: CORS_ORIGIN
              value: "*"
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: JWT_SECRET}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigocrm.fullname" . }}-api
spec:
  selector: {app: {{ include "omnigocrm.fullname" . }}-api}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: {{ include "omnigocrm.fullname" . }}-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigocrm.fullname" . }}-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels: {app: {{ include "omnigocrm.fullname" . }}-worker}
  template:
    metadata: {labels: {app: {{ include "omnigocrm.fullname" . }}-worker}}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "omnigocrm.fullname" . }}-postgres:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://{{ include "omnigocrm.fullname" . }}-redis:6379
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (include "omnigocrm.fullname" .) .Values.existingSecret}}, key: POSTGRES_PASSWORD}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnigocrm.fullname" . }}-web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels: {app: {{ include "omnigocrm.fullname" . }}-web}
  template:
    metadata: {labels: {app: {{ include "omnigocrm.fullname" . }}-web}}
    spec:
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omnigocrm.fullname" . }}-web
spec:
  type: LoadBalancer
  selector: {app: {{ include "omnigocrm.fullname" . }}-web}
  ports: [{port: {{ .Values.service.webPort }}, targetPort: 80}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "omnigocrm.fullname" . }}
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.issuerName | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    {{- if .Values.ingress.tls }}
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
    {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "omnigocrm.fullname" . }}-web
                port: {number: 80}
{{- end }}
