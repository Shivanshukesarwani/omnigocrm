services:
  db:
    image: mariadb:11
    container_name: omnigocrm-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: omnigocrm
      MARIADB_USER: omnigocrm
      MARIADB_PASSWORD: ${OMNIGOCRM_DB_PASSWORD:?Set OMNIGOCRM_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${OMNIGOCRM_DB_ROOT_PASSWORD:?Set OMNIGOCRM_DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - omnigocrm_db:/var/lib/mysql

  omnigocrm:
    image: omnigocrm:local
    build:
      context: .
      dockerfile: Dockerfile.espocrm
    container_name: omnigocrm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_PORT: "3306"
      ESPOCRM_DATABASE_NAME: omnigocrm
      ESPOCRM_DATABASE_USER: omnigocrm
      ESPOCRM_DATABASE_PASSWORD: ${OMNIGOCRM_DB_PASSWORD:?Set OMNIGOCRM_DB_PASSWORD in .env}
      ESPOCRM_ADMIN_USERNAME: ${OMNIGOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${OMNIGOCRM_ADMIN_PASSWORD:?Set OMNIGOCRM_ADMIN_PASSWORD in .env}
      ESPOCRM_SITE_URL: ${OMNIGOCRM_SITE_URL:-http://localhost:8080}
    volumes:
      - omnigocrm_data:/var/www/html/data
      - omnigocrm_custom:/var/www/html/custom
      - omnigocrm_client_custom:/var/www/html/client/custom
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  omnigocrm-daemon:
    image: omnigocrm:local
    container_name: omnigocrm-daemon
    restart: unless-stopped
    depends_on:
      omnigocrm:
        condition: service_healthy
    volumes:
      - omnigocrm_data:/var/www/html/data
      - omnigocrm_custom:/var/www/html/custom
      - omnigocrm_client_custom:/var/www/html/client/custom
    entrypoint: docker-daemon.sh

volumes:
  omnigocrm_data:
  omnigocrm_custom:
  omnigocrm_client_custom:
  omnigocrm_db:
