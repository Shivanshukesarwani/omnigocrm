# Local OmniGoCRM integration-test stack.
# All credentials below are deliberately local test credentials. Do not use them in production.
services:
  db-test:
    image: mariadb:11
    container_name: omnigocrm-test-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: omnigocrm_test
      MARIADB_USER: omnigocrm_test
      MARIADB_PASSWORD: omnigocrm_test_password
      MARIADB_ROOT_PASSWORD: omnigocrm_test_root_password
    volumes:
      - omnigocrm_test_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  omnigocrm-test:
    image: omnigocrm:test
    build:
      context: .
      dockerfile: Dockerfile.espocrm
    container_name: omnigocrm-test
    restart: unless-stopped
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db-test
      ESPOCRM_DATABASE_PORT: "3306"
      ESPOCRM_DATABASE_NAME: omnigocrm_test
      ESPOCRM_DATABASE_USER: omnigocrm_test
      ESPOCRM_DATABASE_PASSWORD: omnigocrm_test_password
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: admin12345
      ESPOCRM_SITE_URL: "http://localhost:8081"
      ESPOCRM_LANGUAGE: en_US
      ESPOCRM_TIME_ZONE: Asia/Kolkata
    volumes:
      - omnigocrm_test_data:/var/www/html/data
      - omnigocrm_test_custom:/var/www/html/custom
      - omnigocrm_test_client_custom:/var/www/html/client/custom
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  # EspoCRM scheduled jobs: automation processing, cleanup, etc.
  omnigocrm-test-daemon:
    image: omnigocrm:test
    container_name: omnigocrm-test-daemon
    restart: unless-stopped
    depends_on:
      omnigocrm-test:
        condition: service_healthy
    volumes:
      - omnigocrm_test_data:/var/www/html/data
      - omnigocrm_test_custom:/var/www/html/custom
      - omnigocrm_test_client_custom:/var/www/html/client/custom
    entrypoint: docker-daemon.sh

volumes:
  omnigocrm_test_db:
  omnigocrm_test_data:
  omnigocrm_test_custom:
  omnigocrm_test_client_custom:
