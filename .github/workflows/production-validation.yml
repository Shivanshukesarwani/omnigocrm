name: Production validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose
        shell: bash
        env:
          OMNIGOCRM_DOMAIN: crm.example.com
          OMNIGOCRM_TLS_EMAIL: ci@example.com
          OMNIGOCRM_SITE_URL: https://crm.example.com
        run: |
          mkdir -p secrets
          printf 'ci-db-password' > secrets/db_password.txt
          printf 'ci-admin-password' > secrets/admin_password.txt
          docker compose -f docker-compose.yml config

      - name: Build production image
        run: |
          docker build -f Dockerfile.espocrm --build-arg ESPOCRM_IMAGE=espocrm/espocrm:10.0.8 -t omnigocrm:ci .

      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes > /tmp/omnigocrm-k8s.yaml
