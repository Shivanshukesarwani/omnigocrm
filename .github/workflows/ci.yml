name: OmniGoCRM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  omnigocrm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, exif, gd, intl, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none

      - name: Validate PHP dependencies
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate OmniGoCRM module JSON
        run: |
          find custom/Espo/Modules/OmniGoCRM/Resources -type f -name "*.json" -print0 |
            while IFS= read -r -d '' file; do
              php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
              echo "OK $file"
            done



      - name: Validate OmniGoCRM route classes
        run: |
          php -r '
            require "vendor/autoload.php";
            $routes = json_decode(file_get_contents("custom/Espo/Modules/OmniGoCRM/Resources/routes.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach ($routes as $route) {
                $class = $route["actionClassName"] ?? "";
                if ($class === "" || !class_exists($class)) {
                    fwrite(STDERR, "Missing route action class: " . $class . PHP_EOL);
                    exit(1);
                }
            }
            echo "OK OmniGoCRM route action classes" . PHP_EOL;
          '

      - name: PHPStan analysis for OmniGoCRM
        continue-on-error: true
        run: vendor/bin/phpstan analyse custom/Espo/Modules/OmniGoCRM --level=5 --no-progress --memory-limit=1G

      - name: PHP syntax check for OmniGoCRM code
        run: |
          find custom/Espo/Modules/OmniGoCRM -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l

  legacy-prototype:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Laravel prototype retained for migration reference."

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"

      - name: Build native Android app
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omnigocrm-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
