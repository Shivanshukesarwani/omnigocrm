name: OmniGoCRM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  espocrm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, exif, gd, intl, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none

      - name: Validate EspoCRM dependencies
        run: composer validate --no-check-publish

      - name: Install EspoCRM dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Validate OmniGoCRM module JSON
        run: |
          php -r 'foreach (glob("custom/Espo/Modules/OmniGoCRM/Resources/**/*.json") as $f) { json_decode(file_get_contents($f), true, 512, JSON_THROW_ON_ERROR); echo "OK $f
"; }'

      - name: PHP syntax check for OmniGoCRM code
        run: |
          if [ -d custom/Espo/Modules/OmniGoCRM ]; then
            find custom/Espo/Modules/OmniGoCRM -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l
          fi

  legacy-prototype:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "The Laravel prototype is retained for migration reference and is not the active application."

  mobile:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Mobile builds will be enabled once the native OmniGoCRM clients are established against the EspoCRM API."
