name: OmniGoCRM Test Stack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI secrets
        run: |
          mkdir -p secrets
          printf 'ci-db-password' > secrets/db_password.txt
          printf 'ci-admin-password' > secrets/admin_password.txt
          chmod 600 secrets/*.txt

      - name: Validate Compose
        env:
          OMNIGOCRM_DOMAIN: localhost
          OMNIGOCRM_TLS_EMAIL: ci@example.com
          OMNIGOCRM_SITE_URL: http://localhost
        run: docker compose -f docker-compose.yml config

      - name: Build and start application stack
        env:
          OMNIGOCRM_DOMAIN: localhost
          OMNIGOCRM_TLS_EMAIL: ci@example.com
          OMNIGOCRM_SITE_URL: http://localhost
        run: docker compose -f docker-compose.yml up -d --build db omnigocrm

      - name: Wait for PostgreSQL
        env:
          OMNIGOCRM_DOMAIN: localhost
          OMNIGOCRM_TLS_EMAIL: ci@example.com
          OMNIGOCRM_SITE_URL: http://localhost
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml exec -T db pg_isready -U "${POSTGRES_USER:-omnigocrm}" -d "${POSTGRES_DATABASE:-omnigocrm}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=200 db
          exit 1

      - name: Check application health
        run: |
          for i in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Health.Status}}' omnigocrm-omnigocrm-1 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=300 omnigocrm db
          exit 1

      - name: Validate EspoCRM app
        run: docker compose -f docker-compose.yml exec -T omnigocrm bin/command app-check

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=300 omnigocrm db
          rm -rf /tmp/omnigocrm-espo-logs
          mkdir -p /tmp/omnigocrm-espo-logs
          docker compose -f docker-compose.yml exec -T omnigocrm sh -c 'find /var/www/html/data/logs -type f -maxdepth 1 -print -exec sh -c "echo ----- \\$1 -----; tail -n 300 \\$1" _ {} \\;' 2>/dev/null || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
