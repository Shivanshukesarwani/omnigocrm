name: OmniGoCRM Test Stack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for HTTP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --tail=200
          exit 1

      - name: Check database health
        run: |
          test "$(docker inspect --format='{{.State.Health.Status}}' omnigocrm-test-db)" = "healthy"

      - name: Show stack status
        if: always()
        run: docker compose -f docker-compose.test.yml ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs --tail=300
          rm -rf /tmp/omnigocrm-espo-logs
          mkdir -p /tmp/omnigocrm-espo-logs
          docker cp omnigocrm-test:/var/www/html/data/logs/. /tmp/omnigocrm-espo-logs/ 2>/dev/null || true
          echo "===== EspoCRM internal logs ====="
          find /tmp/omnigocrm-espo-logs -type f -maxdepth 2 -print -exec sh -c 'echo "----- $1 -----"; tail -n 300 "$1"' _ {} \; 2>/dev/null || true
          docker cp omnigocrm-test-db:/var/lib/mysql/general.log /tmp/omnigocrm-espo-logs/mariadb-general.log 2>/dev/null || true
          echo "===== MariaDB schema query log ====="
          tail -n 2000 /tmp/omnigocrm-espo-logs/mariadb-general.log 2>/dev/null || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
