# GitHub Copilot app project configuration for OmniGoCRM.
# Review and trust this file in the GitHub Copilot app before enabling scripts.

instructions: |
  OmniGoCRM is an EspoCRM-based CRM/SaaS application with Docker, PHP,
  Android, and iOS components. Prefer the existing project architecture,
  keep workspace/tenant isolation intact, and run the repository's existing
  validation and CI checks after code changes.

scripts:
  - name: Start OmniGoCRM
    command: docker compose -f docker-compose.espocrm.yml up -d --build

  - name: Stop OmniGoCRM
    command: docker compose -f docker-compose.espocrm.yml down

  - name: Validate PHP
    command: find custom/Espo/Modules/OmniGoCRM -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  - name: Run CI checks
    command: composer validate --no-check-publish && composer install --no-interaction --prefer-dist --no-progress

server_ready_pattern: '(?i)(https?://\S+|localhost:8080)'
auto_open_in_browser: true

automation:
  auto_issue_session: true
  remote_control: false
