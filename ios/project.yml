name: OmniGoCRM
options:
  bundleIdPrefix: com.omnigocrm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OmniGoCRM:
    type: application
    platform: iOS
    sources:
      - OmniGoCRM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnigocrm.ios
        INFOPLIST_KEY_CFBundleDisplayName: OmniGoCRM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
