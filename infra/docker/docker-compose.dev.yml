services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: omnigocrm
      POSTGRES_USER: omnigocrm
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - omnigocrm-postgres:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"
volumes:
  omnigocrm-postgres:
