services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnigocrm
      POSTGRES_USER: omnigocrm
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [omnigocrm-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:8
    restart: unless-stopped
    ports: ["6379:6379"]
  api:
    build: {context: ../.., dockerfile: infra/docker/Dockerfile.api}
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://omnigocrm:change-me@postgres:5432/omnigocrm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:5173
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
  web:
    build: {context: ../.., dockerfile: infra/docker/Dockerfile.web}
    environment: {VITE_API_URL: http://localhost:3000/api/v1}
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  omnigocrm-postgres: